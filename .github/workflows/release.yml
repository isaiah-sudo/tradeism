name: Build and Release Windows Executable & Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --icon=assets/icon.ico --add-data "assets;assets" --add-data "firebase_config.json;." --name DayTradeSim main.py

      - name: Build Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/DayTradeSim-Setup-*.exe
            dist/DayTradeSim.exe
          name: "Day Trading Simulator ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
